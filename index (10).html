<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BLAST BATTLES</title>

  <!-- Google Fonts — loaded before JS so CSS vars render correctly on first paint -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;600;700;800&family=Share+Tech+Mono&display=swap" rel="stylesheet">

  <style>
    /* Hard reset — render.js and main.js take over from here */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; overflow: hidden; background: #0d0f14; }
    /* Scrollbar styling for log panels */
    ::-webkit-scrollbar       { width: 4px; height: 4px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #2a3145; border-radius: 2px; }
  </style>
</head>
<body>
  <!--
    No markup here — main.js builds the full shell on window load.
    Load order matters: each file depends on the ones above it.
  -->
  <script src="js/data.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/grid.js"></script>
  <script src="js/combat.js"></script>
  <script src="js/game-state.js"></script>
  <script src="js/render.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
